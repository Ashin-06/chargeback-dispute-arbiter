[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chargeback-dispute-arbiter"
version = "1.0.0"
description = "Signed chargeback evidence, Visa CE 3.0 friendly-fraud rules and an expected-value representment optimizer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "cryptography>=42",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx2>=2.0", "ruff>=0.6", "bandit>=1.7", "pip-audit>=2.7"]

[project.scripts]
disputearb = "disputearb.__main__:main"

[tool.setuptools]
packages = ["disputearb"]

[tool.setuptools.package-data]
disputearb = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["disputearb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008", "B905"]  # Depends() defaults are FastAPI's idiom; zip(strict=) is style
